# 用法（服务器上）：
#   1. 把下面的 image 改成你的实际仓库地址（CI 构建后输出）：
#        ghcr.io/<你的GitHub用户名>/<仓库名>:latest
#   2. docker compose pull
#      docker compose up -d
#   3. 首次启动会自动下载模型（约 2.6 GB），跟踪日志：
#        docker compose logs -f
#
# 本地不使用 CI 镜像时：docker compose up -d --build

services:
  asr:
    image: ghcr.io/kkkk24juastin/asrdeploy:sha-dd58a2e
    build: .
    container_name: qwen3-asr
    init: true
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8000}:8000"
    volumes:
      - asr-models:/models
    environment:
      ASR_API_KEY: "${ASR_API_KEY:-}"
      HF_ENDPOINT: "${HF_ENDPOINT:-https://huggingface.co}"
      HF_REPO: "${HF_REPO:-ggml-org/Qwen3-ASR-1.7B-GGUF}"
      MODEL_FILE: "${MODEL_FILE:-Qwen3-ASR-1.7B-Q8_0.gguf}"
      MMPROJ_FILE: "${MMPROJ_FILE:-mmproj-Qwen3-ASR-1.7B-Q8_0.gguf}"
      LLAMA_THREADS: "${LLAMA_THREADS:-16}"
      LLAMA_CTX: "${LLAMA_CTX:-16384}"
      LLAMA_EXTRA_ARGS: "${LLAMA_EXTRA_ARGS:-}"

volumes:
  asr-models:
